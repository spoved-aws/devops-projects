apiVersion: v1
kind: Pod
metadata:
  name: "my-first-app-my_first_app-test-connection"
  labels:
    helm.sh/chart: my_first_app-0.1.0
    app.kubernetes.io/name: my_first_app
    app.kubernetes.io/instance: my-first-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['my-first-app-my_first_app:80']
  restartPolicy: Never
