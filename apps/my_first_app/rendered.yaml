metadata:
  name: my-first-app-my_first_app
  labels:
    helm.sh/chart: my_first_app-0.1.0
    app.kubernetes.io/name: my_first_app
    app.kubernetes.io/instance: my-first-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
