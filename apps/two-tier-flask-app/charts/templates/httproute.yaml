{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ include "two-tier-flask-app.fullname" . }}-route
  labels:
    {{- include "two-tier-flask-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}

  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- end }}

  rules:
    - matches:
        - path:
            type: {{ .Values.httpRoute.path.type }}
            value: {{ .Values.httpRoute.path.value }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.httpRoute.backend.serviceName }}
          port: {{ .Values.httpRoute.backend.port }}
          weight: 1
{{- end }}