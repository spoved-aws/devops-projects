{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "two-tier-flask-app.fullname" . -}}
{{- $svcPort := .Values.appService.containerPort -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-route
  labels:
    {{- include "two-tier-flask-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ include "two-tier-flask-app.fullname" . }}
          port: {{ $svcPort }}
    {{- end }}
{{- end }}
