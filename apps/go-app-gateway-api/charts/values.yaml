replicaCount: 1

appNamespace: go-app-gateway-api

image:
  repository: docker.io/kanukhosla10/go-kubesimplify
  tag: sha-9cdf76a
  pullPolicy: Always

resources:
  requests:
    memory: '350Mi'
    cpu: '250m'
  limits:
    memory: '500Mi'
    cpu: '500m'

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20

containerPort: 8080

readinessProbe:
  port: 8080
livenessProbe:
  port: 8080

autoscaling:
  minReplicas: 1
  maxReplicas: 10
  cpu:
    averageUtilization: 20
  memory:
    averageValue: '350Mi'

service:
  name: go-app-gateway-api-service
  portName: http
  port: 8089
  type: ClusterIP
  containerPort: 8080

argocd:
  serviceName: argocd-server
  servicePort: 80

postgresql:
  name: postgresql-cluster
  instances: 1
  storageSize: '1Gi'
  database: goals_database
  owner: goals_user
  port: 5432


postgresqlSecret:
  name: postgresql-credentials
  secretData:
    password: new_password
    username: goals_user

clusterSecret:
  name: postgresql-cluster-credentials
  credentials:
    username: goals_user
    password: new_password
