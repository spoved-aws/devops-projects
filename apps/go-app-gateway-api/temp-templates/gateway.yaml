apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.certManagerIssuer }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: {{ .protocol }}
      hostname: {{ .hostname }}
      {{- if .tlsSecret }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .tlsSecret }}
            kind: Secret
            group: ""
      {{- end }}
    {{- end }}