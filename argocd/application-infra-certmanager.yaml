apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-resources
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  project: default
  source:
    repoURL: git@github.com:you/my-gitops-repo.git
    path: infra/cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true