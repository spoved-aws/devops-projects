apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: two-tier-flask-app
  namespace: argocd  # This is the ArgoCD namespace, not the target namespace
spec:
  project: default
  source:
    repoURL: https://github.com/spoved-aws/devops-projects.git
    targetRevision: feature/two-tier-flask-app
    path: apps/two-tier-flask-app/charts  # Path to the Helm chart

  destination:
    server: https://kubernetes.default.svc
    namespace: two-tier-flask-app       # This is the namespace where resources will be deployed
 
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true