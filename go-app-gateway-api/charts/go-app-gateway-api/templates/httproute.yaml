apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.httproute.name }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.parentGateway }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httproute.pathPrefix }}
      backendRefs:
        - name: {{ .Values.httproute.serviceName }}
          port: {{ .Values.httproute.servicePort }}