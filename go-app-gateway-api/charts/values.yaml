replicaCount: 1

image:
  repository: docker.io/kanukhosla10/go-kubesimplify
  tag: sha-9cdf76a
  pullPolicy: Always

resources:
  requests:
    memory: '350Mi'
    cpu: '250m'
  limits:
    memory: '500Mi'
    cpu: '500m'

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20

containerPort: 8080
readinessProbe:
  port: 8080
livenessProbe:
  port: 8080

autoscaling:
  hpaName: go-ks-app-hpa
  minReplicas: 1
  maxReplicas: 10
  cpu:
    averageUtilization: 20
  memory:
    averageValue: '350Mi'

service:
  name: go-ks-app-arm-service
  portName: http
  port: 8089
  type: ClusterIP

ingress:
  entrypoints: websecure
  tlsEnabled: "true"
  clusterIssuer: letsencrypt-prod
  ingresssApp: go-ks-traefik
  appHost: go-ks.homecluster.io
  appSecretName: go-ks-app-com-tls
  argoIngressName: argo-ks-ingress
  argoHost: argo-ks.homecluster.io
  secretName: argo-ks-tls

argocd:
  serviceName: argocd-server
  servicePort: 80

postgresql:
  name: postgresql-cluster
  instances: 1
  storageSize: '1Gi'
  database: goals_database
  owner: goals_user
  port: 5432


postgresqlSecret:
  name: postgresql-credentials
  secretData:
    password: new_password
    username: goals_user

clusterSecret:
  name: postgresql-cluster-credentials
  credentials:
    username: goals_user
    password: new_password

gateway:
  name: go-app-gateway
  # namespace: default
  className: nginx
  clusterIssuer: letsencrypt-prod

  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "go-app-gateway-api.homecluster.io"

    - name: https
      port: 443
      protocol: HTTPS
      hostname: "go-app-gateway-api.homecluster.io"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: go-app-gateway-api-homecluster-io-tls
            kind: Secret
            group: ""

    - name: argo-http
      port: 80
      protocol: HTTP
      hostname: "argo.homecluster.io"

    - name: argo-https
      port: 443
      protocol: HTTPS
      hostname: "argo.homecluster.io"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: argo-homecluster-io-tls
            kind: Secret
            group: ""

clusterIssuer:
  name: letsencrypt-prod
  # LetsEncrypt production environment
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  # MUST be a valid email address
  email: kanukhosla10@gmail.com
  privateKeySecret: letsencrypt-prod
  gateway:
    name: go-app-gateway
    # namespace: default