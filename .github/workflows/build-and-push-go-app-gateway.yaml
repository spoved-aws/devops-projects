name: Build & Push-go-app-gateway-api

on:
  push:
    branches: [ 'feature/go-app-gateway-api' ]
    paths:
      - 'go-app-gateway-api/**'

env:
  KO_DOCKER_REPO: docker.io/kanukhosla10/go-kubesimplify
  KO_DEFAULTBASEIMAGE: alpine:3
  PATH: /usr/local/go/bin:/usr/local/bin:$PATH

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/go-app-gateway-api

      # 2️⃣ Set up Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.5'

      # 3️⃣ Set up ko
      - name: Set up ko
        uses: ko-build/setup-ko@v0.6
        with:
          version: v0.14.1

      # 4️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | ko login docker.io --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 5️⃣ Get short git SHA
      - name: Get git SHA short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 6️⃣ Build and push image using ko
      - name: Build and Publish Image
        working-directory: go-app-gateway-api/src
        env:
          KO_DATA_PATH: kodata/
          KO_DOCKER_REPO: docker.io/kanukhosla10/go-kubesimplify
          KO_DEFAULTBASEIMAGE: alpine:3
        run: |
          ko build --bare -t sha-${{ env.sha_short }}

      # 7️⃣ Render Helm values.yaml from Jinja template
      - name: Generate deploy manifest from Jinja template
        uses: cuchi/jinja2-action@v1.1.0
        with: 
          template: go-app-gateway-api/tmpl/values.j2
          output_file: go-app-gateway-api/charts/values.yaml
          strict: true
          variables: |
            image_deploy_tag=sha-${{ env.sha_short }}

      # 8️⃣ Configure git for commit
      - name: Configure Git
        run: |
          git config --local user.email "${{ secrets.GIT_COMMITTER_EMAIL }}"
          git config --local user.name "${{ secrets.GIT_COMMITTER_NAME }}"

      # 9️⃣ Stash any unstaged changes
      - name: Stash unstaged changes
        run: git stash --include-untracked

      # 🔟 Pull latest changes from remote branch
      - name: Pull latest changes
        run: git pull origin feature/go-app-gateway-api --rebase

      # 1️⃣1️⃣ Apply stashed changes
      - name: Apply stashed changes
        run: git stash pop || echo "No stashed changes to apply"

      # 1️⃣2️⃣ Commit changes
      - name: Commit deploy manifest
        run: |
          git add go-app-gateway-api/charts/values.yaml
          git commit -m "updated image tag to sha-${{ env.sha_short }}" || echo "No changes to commit"

      # 1️⃣3️⃣ Ensure local branch tracks remote
      - name: Ensure branch tracks remote
        run: git branch --set-upstream-to=origin/feature/go-app-gateway-api feature/go-app-gateway-api || git push -u origin feature/go-app-gateway-api

      # 1️⃣4️⃣ Push changes
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GH_PAT_SYNOLOGY }}
          branch: feature/go-app-gateway-api
          force: true