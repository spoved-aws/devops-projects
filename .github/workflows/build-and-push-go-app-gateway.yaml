name: Build & Push-go-app-gateway-api

on:
  push:
    branches: [ 'feature/go-app-gateway-api' ]
    paths:
      - 'go-app-gateway-api/**'

env:
  KO_DOCKER_REPO: docker.io/kanukhosla10/go-kubesimplify
  KO_DEFAULTBASEIMAGE: alpine:3
  GIT_COMMITTER_EMAIL: kanukhosla10@gmail.com
  GIT_COMMITTER_NAME: spoved-aws

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      # 1️⃣ Checkout the repo and persist credentials
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/go-app-gateway-api
          persist-credentials: true

      # 2️⃣ Ensure we have a local branch (fix detached HEAD)
      - name: Create local branch
        run: git checkout -B ${{ github.ref_name }}

      # 3️⃣ Set up Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.5'

      # 4️⃣ Set up ko
      - name: Set up ko
        uses: ko-build/setup-ko@v0.6
        with:
          version: v0.14.1

      # 5️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | ko login docker.io --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # 6️⃣ Get short git SHA
      - name: Get git SHA short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 7️⃣ Build and publish image using ko
      - name: Build and Publish Image
        working-directory: go-app-gateway-api/src
        env:
          KO_DATA_PATH: kodata/
          KO_DOCKER_REPO: ${{ env.KO_DOCKER_REPO }}
          KO_DEFAULTBASEIMAGE: ${{ env.KO_DEFAULTBASEIMAGE }}
        run: |
          ko build --bare -t sha-${{ env.sha_short }}

      # 8️⃣ Render Helm values.yaml from Jinja template
      - name: Generate deploy manifest from Jinja template
        uses: cuchi/jinja2-action@v1.1.0
        with:
          template: go-app-gateway-api/tmpl/values.j2
          output_file: go-app-gateway-api/charts/values.yaml
          strict: true
          variables: |
            image_deploy_tag=sha-${{ env.sha_short }}

      # 9️⃣ Configure Git for commit
      - name: Configure Git
        run: |
          git config user.email "${{ env.GIT_COMMITTER_EMAIL }}"
          git config user.name "${{ env.GIT_COMMITTER_NAME }}"

      # 🔟 Stash unstaged changes (if any)
      - name: Stash unstaged changes
        run: git stash --include-untracked || echo "Nothing to stash"

      # 1️⃣1️⃣ Pull latest changes
      - name: Pull latest changes from remote
        run: git pull origin ${{ github.ref_name }} --rebase

      # 1️⃣2️⃣ Apply stashed changes
      - name: Apply stashed changes
        run: git stash pop || echo "No stashed changes to apply"

      # 1️⃣3️⃣ Commit updated values.yaml
      - name: Commit deploy manifest
        run: |
          git add go-app-gateway-api/charts/values.yaml
          git commit -m "Updated image tag to sha-${{ env.sha_short }}" || echo "No changes to commit"

      # 1️⃣4️⃣ Push changes back to the branch
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GH_PAT_SYNOLOGY }}
          branch: ${{ github.ref_name }}