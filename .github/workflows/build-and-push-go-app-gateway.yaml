name: Build & Push-go-app-gateway-api

on:
  push:
    branches: [ 'feature/go-app-gateway-api' ]
    paths:
      - 'go-app-gateway-api/**'

env:
  KO_DOCKER_REPO: docker.io/kanukhosla10/go-kubesimplify
  KO_DEFAULTBASEIMAGE: alpine:3
  # Added the below evs to github env  
  #   GIT_COMMITTER_EMAIL: kanukhosla10@gmail.com
  #   GIT_COMMITTER_NAME: spoved-aws
  
  PATH: /usr/local/go/bin:/usr/local/bin:$PATH

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1 - Checkout the repo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git rev-parse
          ref: feature/go-app-gateway-api

      # 2 - Set up Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22.5'

      # 3 - Set up ko
      - name: Set up ko
        uses: ko-build/setup-ko@v0.6
        with:
          version: v0.14.1  # Specify the version of ko if needed

      # 4 - Log in to Docker Hub
      - name: Log in to Docker Hub
        env:
          KO_DOCKER_REPO: docker.io/kanukhosla10  # Update with your Docker Hub namespace
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | ko login docker.io --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # 5 - Get short git SHA
      - name: Get git SHA short
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 6 - Build and push image using ko
      - name: Build and Publish Image
        env:
          KO_DATA_PATH: kodata/
          KO_DOCKER_REPO: docker.io/kanukhosla10/go-kubesimplify
          KO_DEFAULTBASEIMAGE: alpine:3
        run: |
          ko build --bare -t sha-${{ env.sha_short }}

      # 7 - Render Helm values.yaml from Jinja template
      - name: Generate deploy manifest from Jinja template
        uses: cuchi/jinja2-action@v1.1.0
        with: 
          template: go-app-gateway-api/tmpl/deploy.j2
          output_file: go-app-gateway-api/charts/values.yaml
          strict: true
          variables: |
            image_deploy_tag=sha-${{ env.sha_short }}

      # 8 - Configure git for commit
      - name: Configure Git
        run: |
          git config --local user.email "${{ env.GIT_COMMITTER_EMAIL }}"
          git config --local user.name "${{ env.GIT_COMMITTER_NAME }}"

      # 9 - Stash unstaged changes        
      - name: Stash unstaged changes
        run: git stash --include-untracked
      
      # 10 - Stash unstaged changes   
      - name: Pull latest changes from the remote branch
        run: git pull origin ${{ github.ref_name }} --rebase
        
      - name: Apply stashed changes
        run: git stash pop || echo "No stashed changes to apply"      

      # 9️⃣ Commit changes on local repo
      - name: Commit deploy manifest
        run: |
          git add go-app-gateway-api/charts/values.yaml
          git commit -m -s "updated image tag to sha-${{ env.sha_short }}" || echo "No changes to commit"
      

      # 🔟 Push to repo
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}